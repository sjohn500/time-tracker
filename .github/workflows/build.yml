name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Show what the APK requires
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)aapt
          $AAPT dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "sdkVersion|targetSdk|native-code"
      - uses: actions/upload-artifact@v4
        with:
          name: time-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
